# Modules from kernel-modules-extra that nothing on this system needs.
#
# The recipe installs kernel-modules-extra for a single driver: xpad, for the 8BitDo controller.
# The package brings about 100 modules along. Fedora leaves it out by default because they are
# rarely used. The ones below are the risky part: nothing here needs them, and the kernel would
# load them on demand, for example for a USB stick with such a filesystem.
#
# 'install <module> /bin/false' means: instead of loading the module, run /bin/false, which does
# nothing and reports failure. So the module never loads, on demand or by a manual 'modprobe'.
# 'blacklist', which Fedora itself uses for rds, l2tp and batman-adv, only stops automatic loading.
#
# Check with 'modprobe --dry-run --verbose nilfs2' → it should say: 'install /bin/false'.
# To use one of them on a single machine, copy this file to /etc/modprobe.d/ and delete its line there.

# Filesystems
install affs /bin/false
install befs /bin/false
install coda /bin/false
install gfs2 /bin/false
install nilfs2 /bin/false
install ubifs /bin/false
install ufs /bin/false

# Filesystems: OCFS2 with its helper modules
install ocfs2 /bin/false
install ocfs2_dlm /bin/false
install ocfs2_dlmfs /bin/false
install ocfs2_nodemanager /bin/false
install ocfs2_stack_o2cb /bin/false
install ocfs2_stack_user /bin/false
install ocfs2_stackglue /bin/false

# Cluster lock manager, only used by GFS2 and OCFS2
install dlm /bin/false

# Network protocols: RDS (for data centres), L2TP tunnels, batman-adv mesh networks
install rds /bin/false
install rds_rdma /bin/false
install rds_tcp /bin/false
install l2tp_debugfs /bin/false
install l2tp_eth /bin/false
install l2tp_netlink /bin/false
install l2tp_ppp /bin/false
install batman_adv /bin/false

# Network protocols: ATM, a telephone network technology
install br2684 /bin/false
install pppoatm /bin/false
