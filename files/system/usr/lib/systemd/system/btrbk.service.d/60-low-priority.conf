[Service]
# Back up in the background without slowing down the desktop:
# lowest CPU priority, and disk access only when no other process needs the disk.
# (The idle I/O class needs an I/O scheduler that honors priorities, e.g. mq-deadline or bfq;
# check with 'cat /sys/block/sdX/queue/scheduler'.)
Nice=19
IOSchedulingClass=idle

# More detail in the journal. The empty line is required: it clears the packaged
# command, otherwise systemd would run both.
ExecStart=
ExecStart=/usr/bin/btrbk run --verbose

# Skip the backup while gaming (script not in use):
# ExecStartPre=/usr/local/bin/check_gaming.sh
