[Unit]
# The backup SSD is mounted with 'nofail', so the boot does not wait for it. btrbk.timer has
# Persistent=true, so a missed run starts right at boot, possibly before the disks are unlocked and mounted.
# Wait for the mounts btrbk uses instead: both source volumes and the backup target.
# If one of them is missing, btrbk does not run.
# Keep these paths in sync with the 'volume' and 'target' lines in /etc/btrbk/btrbk.conf.
RequiresMountsFor=/var/mnt/data_ssd_root /var/mnt/documents_ssd_root /var/mnt/backup_ssd
