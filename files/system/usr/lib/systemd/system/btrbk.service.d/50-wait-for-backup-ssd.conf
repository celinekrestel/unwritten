[Unit]
# The backup SSD is mounted with 'nofail', so the boot does not wait for it. btrbk.timer has
# Persistent=true, so a missed daily run starts right at boot, possibly before the SSD is unlocked and mounted.
# Wait for both backup mounts instead. If the SSD is missing, btrbk does not run.
# Keep these paths in sync with the fstab entries for the backup SSD.
RequiresMountsFor=/var/mnt/backup_ssd /var/mnt/backup_ssd/backup_daten
