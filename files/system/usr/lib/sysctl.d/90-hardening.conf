# Kernel hardening: four settings that cost nothing on a desktop.
#
# They come from a lynis audit (test KRNL-6000). The rest of its list either breaks things here
# (modules_disabled, a strict rp_filter, kptr_restrict = 2) or brings nothing on a desktop.
# Check a live value with 'sysctl <name>', e.g. 'sysctl kernel.yama.ptrace_scope'.
# To change one on a single machine, set it in a file in /etc/sysctl.d/.

# A program may only inspect another program's memory if it started it or was invited to.
# 1 is the kernel's own default and Ubuntu's; Fedora sets 0 so debuggers can attach without root.
# Wine and Proton allow for it. Side effect: gdb or strace on a running program needs run0.
kernel.yama.ptrace_scope = 1

# Hide kernel memory addresses from programs that don't run as root; this makes exploits harder.
# Ubuntu's default. Not 2: root keeps seeing them, which BPF tools like Proton's daemon may need.
kernel.kptr_restrict = 1

# Normal programs can no longer load serial-line kernel modules ("line disciplines"),
# a classic source of exploits. Nothing on a desktop needs that.
dev.tty.ldisc_autoload = 0

# Ignore "use a different route" messages (ICMP redirects) from the network. Only routers need
# them, and on public Wi-Fi they can be used to redirect traffic. * covers every network interface.
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
