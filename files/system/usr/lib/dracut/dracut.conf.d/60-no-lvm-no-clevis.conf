# The base image asks for these dracut modules in 30-bootc-standard.conf, 49-bootc-tpm2-tss.conf and
# 50-bootc-clevis.conf, and dracut stops when it can't install a module it was asked for. Unwritten
# has no LVM and unlocks its disks by passphrase, so recipe.yml removes the packages behind them.
# To bring LVM or Clevis back, take its modules out of this line too.
omit_dracutmodules+=" lvm clevis clevis-pin-tpm2 tpm2-tss "
