<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may talk to Proton VPN's two root services.

  Proton's packages let every user on the machine call them, and the services do not check who is
  calling: SetConfig takes the user ID as a plain argument, so any account could exclude programs
  from the VPN, and the name of the split tunneling service can be taken over by anyone.
  These rules limit both services to root and wheel. Processes of my own user can still call them.

  It has to be this file: D-Bus reads it last, so its rules win over Proton's.
  Check with 'run0 -u nobody busctl call me.proton.vpn.split_tunneling
  /me/proton/vpn/split_tunneling me.proton.vpn.split_tunneling GetAllConfigs'. It should say
  'Access denied'. Without 'run0 -u nobody' the same call works.

  Delete this file together with the Proton VPN app.
-->
<busconfig>
  <policy context="default">
    <deny own="me.proton.vpn.split_tunneling"/>
    <deny send_destination="me.proton.vpn.split_tunneling"/>
    <deny send_destination="me.proton.vpn.kill_switch"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="me.proton.vpn.split_tunneling"/>
    <allow send_destination="me.proton.vpn.kill_switch"/>
  </policy>
  <policy user="root">
    <allow own="me.proton.vpn.split_tunneling"/>
    <allow send_destination="me.proton.vpn.split_tunneling"/>
    <allow send_destination="me.proton.vpn.kill_switch"/>
  </policy>
</busconfig>
