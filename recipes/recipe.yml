# This section goes down as as soon I switch to Firefox (Flatpak).

# Deliberately placed AFTER the main package block: the -freeworld packages
# replace their Fedora counterparts, so those have to be installed first.

# Why I include a codec stack on the host at all:

# Firefox (native rpm) uses host Mesa for VA-API and libavcodec for decode.
# Native Firefox is needed because KeePassXC integration needs to spawn a host process. 
# The Flatpak workarounds require granting Firefox host-exec rights, which defeats the sandbox.
# What's at stake is phishing protection: the extension matches the stored URL against the page.

# Everything else (mpv, Steam, all other Flatpaks) gets hardware decode from the Freedesktop runtime's → extra branches, independent of this block.

#  - type: dnf
#    repos:
#      cleanup: true
#      nonfree: rpmfusion
#    install:
#      packages:
#        - mesa-va-drivers-freeworld  # VA-API H.264/HEVC; Fedora's mesa has codecs stripped
#        - libavcodec-freeworld       # H.264/HEVC decode for native Firefox

