  #    - 5470      # Weather O'Clock: https://extensions.gnome.org/extension/5470/weather-oclock/

######################
##  GNOME defaults  ##
######################

# Defaults for every user, in files/system/usr/share/glib-2.0/schemas/zz1-unwritten.gschema.override.
# A value set with gsettings still wins. --strict stops the build if a key in there no longer exists.

  - type: script
    source: *script
    snippets:
      - glib-compile-schemas --strict /usr/share/glib-2.0/schemas

##################
##  PAM / Auth  ##
##################

# fprintd is not part of this image – without this, PAM will get noisy.

  - type: script
    source: *script
    snippets:
      - authselect disable-feature with-fingerprint

###############
##  Sudon't  ##
###############

# I try to follow the Sudon't approach of VanillaOS; see:
# https://vanillaos.org/nerd-info

  - type: script
    source: *script
    scripts:
      - sudont.sh

################
##  Stamp it  ##
################

  - type: os-release
    source: ghcr.io/blue-build/modules/os-release@sha256:64c6ef094a55bc10073bbce4316e3ec5a4f357e396f449469fdd47844ed6ff66
    properties:
      ID: unwritten
      ID_LIKE: fedora
      NAME: Unwritten
      VERSION: "45"
      PRETTY_NAME: Unwritten 45
      DEFAULT_HOSTNAME: unwritten
      VERSION_CODENAME: Next

######################################
##  Firewall and network discovery  ##
######################################

# This machine doesn't look for printers, scanners or other devices on the network, and it doesn't
# announce itself there: avahi (mDNS) is disabled in the systemd module below, the printing and
# discovery extras are excluded above, and LLMNR/mDNS are off in systemd-resolved
# (files/system/usr/lib/systemd/resolved.conf.d/60-no-network-discovery.conf).
# Fedora's public firewall zone also lets in ssh (the SSH server is not installed) and mdns (avahi is off);
# only DHCPv6 stays. A machine with its own /etc/firewalld/zones/public.xml keeps that file.
# To bring discovery back on one machine, see the README: Notes, 'Network discovery'.
# (firewall-offline-cmd calls it --remove-service-from-zone; its --remove-service is an old lokkit option.)

  - type: script
    source: *script
    snippets:
      - firewall-offline-cmd --zone=public --remove-service-from-zone=ssh --remove-service-from-zone=mdns

########################
##  Systemd services  ##
########################

# Enable, disable and mask systemd services.

  - type: systemd
    source: ghcr.io/blue-build/modules/systemd@sha256:2d2b3d8f7388a999544dbaa90de639f4bbe37f2f6adb4af8dabce5cb5cd4090a
    system:
      enabled:
        - gdm.service                              # Enables GNOME Display Manager on boot
        - systemd-timesyncd.service                # Enables lightweight network time sync
        - systemd-resolved.service                 # Enables local DNS resolution daemon
        - killswitch.service                       # Blocks traffic outside the VPN tunnel; see the README: Notes, 'VPN and kill switch'
        - btrbk.timer                              # Enables btrfs backup timer routine
        - firewalld.service
      disabled:
        - rpm-ostree-countme.timer                 # Disables sending analytics/counting data to Fedora
        - avahi-daemon.service                     # No network discovery; see 'Firewall and network discovery'
        - avahi-daemon.socket                      # Would start avahi on demand
      masked:
        - bootc-fetch-apply-updates.timer          # Stops automatic bootc fetches (manual control only)
        - bootc-fetch-apply-updates.service        # Stops automatic bootc updates
        - systemd-remount-fs.service               # Masks remount service (often unnecessary on OSTree)
        - flatpak-add-fedora-repos.service         # No Fedora Flatpak repo, Flathub lives in files/system/etc/flatpak/remotes.d/flathub.flatpakrepo
        - mdmonitor.service                        # No RAID here; mdadm itself stays because udisks2 needs it
        - raid-check.timer                         # No RAID here
    user:
      enabled:
        - gcr-ssh-agent.socket                     # Enables the SSH agent that KeePassXC loads its keys into; Fedora's presets leave it off

############################
##  Set Kernel arguments  ##
############################

# Kernel settings that can change at runtime (sysctl) are in
# files/system/usr/lib/sysctl.d/90-hardening.conf, each with an explanation.

        #############################
        # Plymouth, kernel argument #
        #############################

        # Disable Plymouth (it is not part of Unwritten):

  - type: kargs
    source: ghcr.io/blue-build/modules/kargs@sha256:e54b580450f2f6674721b8fc752686cd198fdfbe2210a2502a02dd16738ad247
    kargs:
      - plymouth.enable=0
      - rd.plymouth=0
      - rd.info=1

        ####################################
        # Full Preemption, kernel argument #
        ####################################

        # Turn on Full Preemption:

      - preempt=full

        # Check this with 'grep -o 'preempt=full' /proc/cmdline' → it should say: 'preempt=full';
        # Check this also with 'run0 cat /sys/kernel/debug/sched/preempt' → it should say: '(full) lazy'.

        #############################
        # Keyboard, kernel argument #
        #############################

        # For my Varmilo keyboard, so I don't have to press the 'FN' key to get 'F1'–'F12' working.

      - hid_apple.fnmode=2

        ################################
        # Compression, kernel argument #
        ################################

        # Transparent zstd:1 compression for the whole system-disk btrfs.

      - rootflags=subvol=root,compress=zstd:1

        # Explanation:
        # Btrfs takes fs-wide options (compress, commit, ...) from the FIRST mount of a filesystem, which on
        # bootc is /sysroot from the initrd via rootflags= — so compress=zstd:1 on the /var and /var/home
        # fstab lines is ignored, and systemd-remount-fs (masked, and /var is not / under composefs) can't help.
        # subvol=root MUST stay in the value: the install-time rootflags=subvol=root is still on the cmdline,
        # and this form is correct whether the two get concatenated or the last one wins.
        # Verify: 'findmnt -t btrfs -o TARGET,OPTIONS' → /sysroot, /var and /var/home show compress=zstd:1.
        # Only data written after this is compressed; do not defragment to recompress while btrbk snapshots exist.
        # See: https://discussion.fedoraproject.org/t/root-mount-options-are-ignored-in-fedora-atomic-desktops-42-and-later/148562
        # See: https://gitlab.com/fedora/ostree/sig/-/work_items/72
        # See: https://github.com/ublue-os/bazzite/issues/3602

#################
##  Initramfs  ##
#################

  - type: initramfs
    source: ghcr.io/blue-build/modules/initramfs@sha256:9959ae9f131c68019a189c6840db5c080db238f5ccb249651ff39756f623aad3

######################
##  Make it clean.  ##
######################

  - type: script
    source: *script
    snippets:
      - rm -rf /usr/share/doc
      - rm -rf /usr/src
      - dnf5 clean all

######################
##  Sign the image  ##
######################

# Set up policy & signing files for your signed image:

  - type: signing
    source: ghcr.io/blue-build/modules/signing@sha256:6227e5ac294e9b60a77836775700df879d8a39b184ca3e511edf73cc58f1f4a6

######################
##  Lint the image  ##
######################

# bootc's own checks for common image mistakes. Fatal problems fail the build; warnings are only printed.
# Keep this as the last module.

  - type: script
    source: *script
    snippets:
      - bootc container lint

