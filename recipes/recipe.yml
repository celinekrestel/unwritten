# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

##########################################
##          ##################          ##
##          ## Unwritten 45 ##          ##
##          ##################          ##
##########################################

###################################################
##  Find a removal log at the end of this file.  ##
###################################################

###########################
## What I am waiting for ##
###########################

# 1) I'm waiting for the KeePassXC browser integration for the Flatpak version of Firefox. However, as of 2026-09-26, I don't see that Firefox (Flatpak) and KeePassXC (Flatpak) will officially work together via browser integration in the foreseeable future, and I won't use any workarounds suggested by online tutorials/guides.

###########################################
##  Image metadata & base configuration  ##
###########################################

name: unwritten
description: Unwritten 45
base-image: quay.io/fedora/fedora-bootc
image-version: 45
cosign-version: none      # Container signing via cosign
nushell-version: none     # BlueBuild scripting during the build process
blue-build-tag: none      # BlueBuild won't append its tags to this image

# Every module runs as root while the image is built, and the result gets my signature. So each
# module is fixed to one exact build with 'source:' (unlike a tag, a digest can't be moved to other
# code). 'dnf' and 'script' are used several times: the first entry holds the digest (&), the others
# refer to it (*). To update: change the digest on a branch, merge once Test Build is green.
# ~/.scripts/bluebuild_modules_check.sh shows which modules have a newer version.

modules:
  - type: dnf
    source: &dnf ghcr.io/blue-build/modules/dnf@sha256:e6cffa08197dc55f2cdc9f596e5bae6af4dc82e8a33884ff5a4edccc251b0218
    install:
      packages:
        - fedora-logos   # Provides base Fedora visual assets

  - type: files
    source: ghcr.io/blue-build/modules/files@sha256:c93091889e5552a25d8169f8b5ba6d2cf201fd924f342025e6f2388c1ac4a356
    files:
      - source: system   # Copies local ./system directory files over to /
        destination: /

########################################################
##  Remove packages from the fedora-bootc base image  ##
########################################################

  - type: dnf
    source: *dnf
    remove:
      packages:
        # - console-login-helper-messages
        - chrony                           # Replaced with systemd-timesyncd (see systemd section)
        - sssd*                            # Not needed if only local users are used
        - qemu-user-static*                # Not needed unless cross-arch dev is required
        - toolbox                          # Replaced by distrobox (see below)

  - type: script
    source: &script ghcr.io/blue-build/modules/script@sha256:d6076360da9195e2a6d781043a1b049bede3d2389757912a828a957bc78929b8
    snippets:
      - rm -f /usr/bin/chsh /usr/bin/lchsh # Footgun. See https://github.com/ublue-os/main/issues/598

################################################
##  Core Software, Utilities, and GNOME Base  ##
################################################

  - type: dnf
    source: *dnf
    repos:
      cleanup: true
    install:
      packages:

        #################################
        ##  Hardware & System Sensors  ##
        #################################

        - alsa-sof-firmware                # Sound Open Firmware. Crucial for modern Intel/AMD audio DSPs
        - hplip                           # HP Linux Imaging and Printing suite. Needed for the LaserJet 4000TN – hpcups renders on the PC and sends PCL;
                                           # the printer's 1997 PostScript interpreter fails on PDFs with images no matter the converter (pdftops, gs, pdftocairo all tested 2026-09-14).
        - lshw                             # Detailed hardware lister utility
        - mt7xxx-firmware                  # Wi-Fi and Bluetooth firmware for the laptop's MediaTek MT7921 (was only a weak dependency)
        - nvme-cli                         # Command-line tool for managing NVMe SSDs
        - nvtop                            # Task monitor specifically for GPUs (AMD, Intel, NVIDIA)
        - powerstat                        # Tool to measure laptop power consumption
        - sane-backends-drivers-scanners   # Universal scanner drivers for Linux
        - smartmontools                    # S.M.A.R.T. disk health monitoring utilities
        - gnome-keyring                    # Secrets and passwords for GNOME apps
        - pipewire-pulseaudio              # PulseAudio compatibility (Firefox, Flatpaks)
        - wireplumber                      # Session manager for PipeWire
        - xorg-x11-server-Xwayland         # For X11 apps on Wayland

        ################################
        ##  System Tools & Utilities  ##
        ################################

        - atuin                            # Magical shell history synced across multiple devices
        - bc                               # Basic Calculator. CLI tool for mathematical processing
        - btop                             # Beautiful terminal resource monitor (CPU, memory, disks)
        - btrbk                            # Tool for creating snapshots/backups of btrfs subvolumes
        - cryptsetup                       # LUKS tool. The base image has it, but without Clevis nothing here needs it
        - cups                             # Common UNIX Printing System, required for printing
        - distrobox                        # Run any Linux distribution inside your terminal
        - firewalld                        # Dynamic firewall management daemon
        - flatpak                          # Linux application sandboxing and distribution framework
        - fzf                              # Command-line fuzzy finder for fast terminal searches
        - git                              # Distributed version control system
        - libnotify                        # notify-send, for the message from the kill switch launcher
        - lynis                           # Security auditing tool for Unix-like systems
        - mbuffer                          # progress display for btrbk --progress
        - micro                            # Modern and intuitive terminal-based text editor
        - openssl                          # Toolkit for TLS/SSL cryptographic protocols
        - pv                               # Pipe Viewer, monitors the progress of data in pipelines
        - rsync                            # Copy files
        - symlinks                         # A tiny utility to find and fix broken symlinks
        - systemd-oomd-defaults            # Out-of-memory daemon default configuration
        - unzip                            # Utility to extract zip archives
        - wget                             # Command-line utility for downloading files from the web
        - wl-clipboard                     # Command-line copy/paste utilities for Wayland
        - xwininfo                         # Window information utility for legacy X11 applications
        - zram-generator-defaults          # Config to auto-generate a compressed RAM disk (zram)
        - zstd                             # Zstandard fast real-time compression algorithm
        - zsh                              # The Z shell, a highly customizable bash alternative

        ########################
        ##  Networking Tools  ##
        ########################

        - NetworkManager-config-connectivity-fedora  # NetworkManager connectivity checks for Fedora
        - NetworkManager-wifi                        # Core WiFi support for NetworkManager
        - wireguard-tools                            # Utilities for managing the WireGuard VPN protocol

        ######################
        ##  Media & Codecs  ##
        ######################

        - gstreamer1-plugin-openh264       # Without it, GNOME screencasts are saved as .webm instead of .mp4
        # - libva-utils                    # Collection of testing utilities for VA-API
        # - gstreamer1-plugin-libav        # FFmpeg-based decoders (H.264/HEVC via libavcodec-freeworld)
        # - gstreamer1-plugins-good        # Core well-supported plugin set
        # - gstreamer1-plugins-bad-free    # Parsers and demuxers incl. HEVC

        ########################
        ##  GNOME Components  ##
        ########################

        - gdm                                   # GNOME Display Manager (the login screen)
        - glycin-thumbnailer                    # Sandboxed image thumbnailer used by modern GNOME apps
        - gnome-bluetooth                       # Bluetooth pairing and management tools for GNOME
        - gnome-color-manager                   # Display color profile manager for GNOME
        - gnome-control-center                  # GNOME's main unified settings interface
        - gnome-disk-utility                    # Disks application for formatting and mounting drives
        - gnome-session-wayland-session         # Enables the Wayland session for GNOME
        - gnome-settings-daemon                 # Background daemon handling GTK and session settings
        - gnome-shell                           # The core user interface of the GNOME desktop
        - gnome-shell-extension-caffeine        # Keep the screen awake
        - gnome-shell-extension-appindicator    # Bring tray bar icons to GNOME
        - gnome-shell-extension-blur-my-shell   # Eye candy for GNOME
        - gnome-shell-extension-just-perfection # Can also disable some UI elements
        - gnome-shell-extension-background-logo # Transparent Fedora background logo for your desktop
        - gvfs-fuse                             # FUSE support for the GNOME Virtual File System
        - gvfs-mtp                              # Media Transfer Protocol support (mounts Android phones)
        - nautilus                              # GNOME's default file manager (Files)
        - ptyxis                                # Container-oriented terminal emulator for GNOME
        - xdg-desktop-portal-gnome              # GNOME backend for Flatpak file/screen-sharing portals
        - xdg-user-dirs-gtk                     # Manages localized user directories (Documents, Downloads)

        ############################
        ##  Fonts, Themes & L10N  ##
        ############################

        - fira-code-fonts                  # Monospace font with programming ligatures
        - glibc-langpack-de                # German language pack for GNU C Library
        - glibc-langpack-en                # English language pack for GNU C Library
        - glibc-langpack-fr                # French language pack for GNU C Library
        - google-noto-sans-cjk-vf-fonts    # Font support for Chinese, Japanese, and Korean

        ############
        ##  Niri  ##
        ############

        #- niri                             # 'A scrollable-tiling Wayland compositor' written in Rust
        #- noctalia                         # 'A family of native Wayland projects that feel like one desktop' written in C++

        ####################
        ##  For DeaDBeeF  ##
        ####################

        # Not installed while I test DeaDBeeF as a Flatpak (io.sourceforge.deadbeef from FlatPark).
        # The native version needs both again.
        # - gtk3                # DeaDBeeF is built on the GTK3 toolkit
        # - libdbusmenu         # For DeaDBeeF's tray-icon plugin

        #########################
        ##  User Applications  ##
        #########################

        # None.

      ##################################
      ##  Excluded weak dependencies  ##
      ##################################

      # dnf also installs packages that other packages merely recommend ("weak dependencies").
      # These are kept out on purpose. If one of them ever becomes a hard dependency, the build fails and tells you.

      exclude:
        - alacritty                        # niri's default terminal; not used here
        - avahi-tools                      # Network discovery tools; avahi is off
        - braille-printer-app              # Braille embosser support
        - cpp                              # C preprocessor for xrdb; only X11 sessions call xrdb, and GNOME runs on Wayland here
        - cups-browsed                     # Finds and shares network printers; the printer is USB
        - cups-filters-driverless          # Driverless printing for network printers; the printer is USB
        - evolution-ews-core               # Microsoft Exchange support; not used
        - exiv2                            # Image metadata tool; it can live in a distrobox, Nautilus only needs exiv2-libs
        - fuzzel                           # App launcher recommended by niri; Noctalia replaces it
        - gnome-remote-desktop             # Remote access to this machine; not wanted
        - gnome-tour                       # GNOME welcome tour
        - google-noto-sans-mono-cjk-vf-fonts # Monospaced CJK; google-noto-sans-cjk-vf-fonts covers what I read
        - gst-thumbnailers                 # Thumbnailer for video and audio files in Nautilus (possible security implications)
        - ibus                             # Input methods and an emoji picker, 146 MB of dictionaries; gnome-shell only needs ibus-libs
        - intel-mediasdk                  # Intel video acceleration; AMD machine
        - intel-vpl-gpu-rt                 # Intel video acceleration; AMD machine
        - ipp-usb                          # For modern driverless USB printers/scanners; neither device is one
        - libcamera-ipa                    # Only needed for MIPI cameras; USB webcams and DroidCam work without it
        - libsane-hpaio                    # HP scanner backend; the scanner is a Canon LiDE 200 (USB)
        - malcontent-control               # Parental controls
        - nss-mdns                         # Resolves .local names through avahi; avahi is off
        - pipewire-plugin-libcamera        # Only needed for MIPI cameras; USB webcams and DroidCam work without it
        - python3-perf                     # Only tuned's scheduler plugin needs it, and no power profile uses that plugin
        - rygel                            # DLNA media sharing; not used
        - sane-backends-drivers-cameras    # SANE camera drivers; the scanner is a Canon LiDE 200. Also keeps out the setgid lockdev
        - swaylock                         # Screen locker recommended by niri; Noctalia replaces it
        - unbound-anchor                   # Refreshes DNSSEC root keys by timer for unbound, which doesn't run here
        - usbmuxd                          # iOS device support
        - waybar                           # Status bar recommended by niri; Noctalia replaces it

############################
##  Extra kernel modules  ##
############################

# xpad (XInput controllers, e.g. 8BitDo Ultimate 2C via 2.4G dongle) lives in kernel-modules-extra.
# Pinned to the base image's kernel, otherwise dnf pulls in a second, newer kernel.
# updates-archive is needed when the base image kernel lags behind the updates repo.
# The package brings about 100 other modules along. The risky ones that nothing here needs are
# blocked in files/system/usr/lib/modprobe.d/90-unused-extra-modules.conf.

  - type: script
    source: *script
    snippets:
      - 'dnf5 -y install fedora-repos-archive'
      - 'dnf5 -y install --enable-repo=updates-archive kernel-modules-extra-$(rpm -q --qf "%{VERSION}-%{RELEASE}" kernel-core)'
      - 'dnf5 -y remove fedora-repos-archive'

##################
##  Wallpapers  ##
##################

  - type: script
    source: *script
    snippets:
      - 'dnf5 -y install f$(rpm -E %fedora)-backgrounds-gnome'   # Wallpapers that fit the current Fedora version

####################
##  DNF removals  ##
####################

# fedora-bootc is a server image. 'exclude:' doesn't reach what it brings along, because it only keeps
# things out of what this recipe installs, so the base image's leftovers are removed here. This comes
# after all installs, so that no weak dependency can bring them back. How to bring something back on
# purpose is in the removal list at the end of this file.

  - type: dnf
    source: *dnf
    repos:
      cleanup: true
    remove:
      packages:
        - yelp                             # Removes the default GNOME help browser
        - yelp-libs                        # Removes libraries associated with Yelp
        - yelp-xsl                         # Removes XSL stylesheets used by Yelp
        - nfs-utils                        # Removes the background daemon for mounting Linux NFS network shares
        - nfsv3-client-utils               # No NFS on this system
        - nfsv4-client-utils               # No NFS on this system
        - nfs-common-utils                 # SUID mount.nfs helper

        # NFS, Kerberos and Active Directory: what 'nfs*' and 'sssd*' left behind
        - rpcbind
        - gssproxy
        - libnfsidmap
        - quota
        - quota-nls
        - adcli
        - adcli-selinux
        - cyrus-sasl-gssapi
        - libdhash
        - libipa_hbac
        - libsss_certmap
        - libsss_idmap
        - libsss_nss_idmap
        - libsss_sudo

        # Support reports for Red Hat, and the AWS SDK (125 MB) that only serves to upload them
        - sos
        - python3-boto3
        - python3-botocore
        - python3-dateutil
        - python3-jmespath
        - python3-s3transfer

        # Firmware for hardware that neither machine has. Both are AMD with Realtek audio; the laptop's
        # MX450 is off in the BIOS, its Wi-Fi and Bluetooth are in mt7xxx-firmware.
        - atheros-firmware
        - brcmfmac-firmware
        - cirrus-audio-firmware
        - intel-audio-firmware
        - intel-gpu-firmware
        - intel-npu-firmware
        - microcode_ctl                    # Intel only; amd-ucode-firmware stays
        - nvidia-gpu-firmware
        - nxpwireless-firmware
        - qcom-wwan-firmware
        - realtek-firmware                 # Realtek Wi-Fi and Bluetooth only; the r8169 NIC's firmware is in linux-firmware
        - tiwilink-firmware

        # fwupd extras: modems, the picture shown during a capsule update, and a local network cache
        - fwupd-plugin-modem-manager
        - fwupd-plugin-uefi-capsule-data
        - libmbim
        - libqmi
        - libqrtr-glib
        - passim

        # LUKS unlocking by TPM or network; I type my passphrase. See 60-no-lvm-no-clevis.conf
        - clevis
        - clevis-dracut
        - clevis-luks
        - clevis-pin-tpm2
        - clevis-systemd
        - jose
        - libjose
        - libluksmeta
        - luksmeta
        - tpm2-tools
        - tpm2-tss-fapi

        # LVM; the disks are LUKS with Btrfs. See 60-no-lvm-no-clevis.conf
        - device-mapper-event
        - device-mapper-event-libs
        - device-mapper-persistent-data
        - lvm2
        - lvm2-libs

        # Server and cloud tools with no job on a desktop
        - NetworkManager-cloud-setup
        - WALinuxAgent-udev
        - chunkah
        - cloud-utils-growpart
        - criu
        - criu-libs
        - dracut-network
        - dracut-squash
        - kdump-utils
        - kexec-tools
        - makedumpfile
        - net-tools
        - openssh-server                   # sshd; the client stays
        - sg3_utils
        - sg3_utils-libs
        - socat
        - squashfs-tools
        - stalld

        # Command-line tools I don't use
        - 7zip

########################
##  GNOME extensions  ##
########################

