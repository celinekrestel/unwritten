        #########################
        ##  User Applications  ##
        #########################

        # None.

      ##################################
      ##  Excluded weak dependencies  ##
      ##################################

      # dnf also installs packages that other packages merely recommend ("weak dependencies").
      # These are kept out on purpose. If one of them ever becomes a hard dependency, the build fails and tells you.

      exclude:
        - alacritty                        # niri's default terminal; not used here
        - evolution-ews-core               # Microsoft Exchange support; not used
        - fuzzel                           # App launcher recommended by niri; Noctalia replaces it
        - gnome-remote-desktop             # Remote access to this machine; not wanted
        - gnome-tour                       # GNOME welcome tour
        - intel-mediasdk                   # Intel video acceleration; AMD machine
        - intel-vpl-gpu-rt                 # Intel video acceleration; AMD machine
        - libcamera-ipa                    # Only needed for MIPI cameras; USB webcams and DroidCam work without it
        - libsane-hpaio                    # HP scanner backend; the scanner is a Canon LiDE 200 (USB)
        - malcontent-control               # Parental controls
        - pipewire-plugin-libcamera        # Only needed for MIPI cameras; USB webcams and DroidCam work without it
        - rygel                            # DLNA media sharing; not used
        - swaylock                         # Screen locker recommended by niri; Noctalia replaces it
        - usbmuxd                          # iOS device support
        - waybar                           # Status bar recommended by niri; Noctalia replaces it

############################
##  Extra kernel modules  ##
############################

# xpad (XInput controllers, e.g. 8BitDo Ultimate 2C via 2.4G dongle) lives in kernel-modules-extra.
# Pinned to the base image's kernel, otherwise dnf pulls in a second, newer kernel.
# updates-archive is needed when the base image kernel lags behind the updates repo.

  - type: script
    snippets:
      - 'dnf5 -y install fedora-repos-archive'
      - 'dnf5 -y install --enable-repo=updates-archive kernel-modules-extra-$(rpm -q --qf "%{VERSION}-%{RELEASE}" kernel-core)'
      - 'dnf5 -y remove fedora-repos-archive'

##################
##  Wallpapers  ##
##################

  - type: script
    snippets:
      - 'dnf5 -y install f$(rpm -E %fedora)-backgrounds-gnome'   # Wallpapers that fit the current Fedora version

######################
##  Proton VPN app  ##
######################

# To test the advanced kill switch, do this → reboot, TTY, curl before login with this command:
# curl -m 5 -sI https://example.com >/dev/null && echo "LEAK: traffic passes" || echo "blocked"

  - type: script
    scripts:
      - proton_vpn_app.sh

