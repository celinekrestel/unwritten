###########################
## What I am waiting for ##
###########################

# 1) I'm waiting for the Proton VPN app (from Flathub) to provide the advanced kill switch feature.
# When this happens: in this recipe, delete the section 'Proton VPN app' and remove 'me.proton.vpn.split_tunneling.service' from the systemd list. In 'files/system/etc/xdg/autostart', delete 'proton.vpn.app.gtk.desktop'. In 'files/scripts', delete 'proton_vpn_app.sh'.

# 2) I'm waiting for keepassxc#1232: the KeePassXC browser integration for the Flatpak version of Firefox. However, as of 2026-09-26, I don't see that Firefox (Flatpak) and KeePassXC (Flatpak) will officially work together via browser integration in the foreseeable future, and I won't use any workarounds suggested by online tutorials/guides.

###########################################
##  Image metadata & base configuration  ##
###########################################

name: unwritten
description: Unwritten 44
base-image: quay.io/fedora/fedora-bootc
image-version: 44
cosign-version: none      # Container signing via cosign
nushell-version: none     # BlueBuild scripting during the build process
blue-build-tag: none      # BlueBuild won't append its tags to this image

modules:
  - type: dnf
    install:
      packages:
        - fedora-logos   # Provides base Fedora visual assets

  - type: files
    files:
      - source: system   # Copies local ./system directory files over to /
        destination: /

########################################################
##  Remove packages from the fedora-bootc base image  ##
########################################################

  - type: dnf
    remove:
      packages:
        # - console-login-helper-messages
        - chrony                           # Replaced with systemd-timesyncd (see systemd section)
        - sssd*                            # Not needed if only local users are used
        - qemu-user-static*                # Not needed unless cross-arch dev is required
        - toolbox                          # Replaced by distrobox (see below)

  - type: script
    snippets:
      - rm -f /usr/bin/chsh /usr/bin/lchsh # Footgun. See https://github.com/ublue-os/main/issues/598

################################################
##  Core Software, Utilities, and GNOME Base  ##
################################################

  - type: dnf
    repos:
      cleanup: true
    install:
      packages:

