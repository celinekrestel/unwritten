        ##  Media & Codecs  ##
        ######################
        
        - heif-pixbuf-loader               # Allows GTK apps to natively render HEIF/HEIC images
        - libva-utils                      # Collection of testing utilities for VA-API

        ########################
        ##  GNOME Components  ##
        ########################
        
        - gdm                              # GNOME Display Manager (the login screen)
        - glycin-thumbnailer               # Sandboxed image thumbnailer used by modern GNOME apps
        - gnome-bluetooth                  # Bluetooth pairing and management tools for GNOME
        - gnome-color-manager              # Display color profile manager for GNOME
        - gnome-control-center             # GNOME's main unified settings interface
        - gnome-disk-utility               # Disks application for formatting and mounting drives
        - gnome-session-wayland-session    # Enables the Wayland session for GNOME
        - gnome-settings-daemon            # Background daemon handling GTK and session settings
        - gnome-shell                      # The core user interface of the GNOME desktop
        - gnome-shell-extension-caffeine   # Extension to keep the screen awake
        - gnome-shell-extension-appindicator # https://extensions.gnome.org/extension/615/appindicator-support/
        - gnome-shell-extension-just-perfection # https://extensions.gnome.org/extension/615/appindicator-support/
        - gvfs-fuse                        # FUSE support for the GNOME Virtual File System
        - gvfs-mtp                         # Media Transfer Protocol support (mounts Android phones)
        - nautilus                         # GNOME's default file manager (Files)
        - orca                             # Screen reader for individuals who are visually impaired
        - ptyxis                           # Container-oriented terminal emulator for GNOME
        - xdg-desktop-portal-gnome         # GNOME backend for Flatpak file/screen-sharing portals
        - xdg-user-dirs-gtk                # Manages localized user directories (Documents, Downloads)

        ############################
        ##  Fonts, Themes & L10N  ##
        ############################
        
        - adw-gtk3-theme                   # Libadwaita styling for legacy GTK3 applications
        - fira-code-fonts                  # Monospace font with programming ligatures
        - glibc-langpack-de                # German language pack for GNU C Library
        - glibc-langpack-en                # English language pack for GNU C Library
        - glibc-langpack-fr                # French language pack for GNU C Library
        - google-noto-sans-balinese-fonts  # Font support for Balinese script
        - google-noto-sans-cjk-vf-fonts       # Font support for Chinese, Japanese, and Korean
        - google-noto-sans-javanese-fonts  # Font support for Javanese script
        - google-noto-sans-sundanese-fonts # Font support for Sundanese script
        - ibm-plex-sans-fonts              # IBM's open-source corporate typeface
        - ibus                             # Intelligent Input Bus, for multilingual keyboard input
        - jetbrains-mono-fonts-all         # Excellent monospace font designed for developers

        #########################
        ##  User Applications  ##
        #########################
        
        - firefox                          # The Mozilla Firefox web browser

  - type: script
    snippets:
      - 'dnf5 -y install f$(rpm -E %fedora)-backgrounds-gnome'   # Wallpapers passend zur Fedora-Version

  - type: script
    scripts:
      - proton_vpn_app.sh
      - swap-kernel.sh
      - sudont.sh

#############################################
##  Media codecs (RPM Fusion, host only)   ##
#############################################
# Deliberately placed AFTER the main package block: the -freeworld packages
# replace their Fedora counterparts, so those have to be installed first.
#
# Why any codec stack is on the host at all:
# 1) Firefox (native rpm) uses host Mesa for VA-API and libavcodec for decode.
#    Native because KeePassXC integration needs to spawn a host process. The Flatpak
#    workarounds require granting Firefox host-exec rights, which defeats the sandbox.
#    What's at stake is phishing protection: the extension matches the stored URL
#    against the page, so a tired human isn't the last line of defence.
#    Revisit when the native-messaging portal lands upstream.
# 2) HEIC thumbnailing in Nautilus: glycin-thumbnailer and heif-pixbuf-loader run
#    on the host against host libheif.
# Everything else (mpv, Steam, all other Flatpaks) gets hardware decode from the
# Freedesktop runtime's → extra branches, independent of this block.

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      packages:
        - libheif-freeworld          # HEIC decode; Fedora's libheif has HEVC stripped
        - mesa-va-drivers-freeworld  # VA-API H.264/HEVC; Fedora's mesa has codecs stripped
        - libavcodec-freeworld       # H.264/HEVC decode for native Firefox

####################
##  DNF removals  ##
####################

  - type: dnf
    repos:
      cleanup: true
    remove:
      packages:
        - gnome-tour                       # Removes the initial GNOME welcome tour application
        - ibus-libpinyin                   # Removes default Chinese Pinyin input method
        - ibus-typing-booster              # Removes the typing autocomplete booster
        - malcontent-control               # Removes parental control enforcement interfaces
        - yelp                             # Removes the default GNOME help browser
        - yelp-libs                        # Removes libraries associated with Yelp
        - yelp-xsl                         # Removes XSL stylesheets used by Yelp
        - nfs-utils                        # Removes the background daemon for mounting Linux NFS network shares
        
         
########################
##  GNOME extensions  ##
########################

  - type: gnome-extensions        
    install:
      # - 7065    # Tiling Shell:                                   https://extensions.gnome.org/extension/7065/tiling-shell/
      - 5470      # Weather O’Clock:                                https://extensions.gnome.org/extension/5470/weather-oclock/
      - 5506    # User Avatar In Quick Settings:                    https://extensions.gnome.org/extension/5506/user-avatar-in-quick-settings/
      # GSConnect, i.e. 1319 (installed as rpm, see above)          https://extensions.gnome.org/extension/1319/gsconnect/
      # Caffeine, i.e. 517 (installed as rpm, see above)            https://extensions.gnome.org/extension/517/caffeine/

##################
##  PAM / Auth  ##
##################

# fprintd is not part of this image – without it, PAM will get noisy:
  - type: script
    snippets:
      - authselect disable-feature with-fingerprint

################
##  Stamp it  ##
################

  - type: os-release
    properties:
      ID: unwritten
      ID_LIKE: fedora
      NAME: Unwritten
      VERSION: "44"
      PRETTY_NAME: Unwritten 44
      DEFAULT_HOSTNAME: unwritten
      VERSION_CODENAME: Next

########################
##  Systemd services  ##
########################

  # Enable, disable and mask systemd services:
  - type: systemd
    system:
      enabled:
        - gdm.service                              # Enables GNOME Display Manager on boot
        - systemd-timesyncd.service                # Enables lightweight network time sync
        - systemd-resolved.service                 # Enables local DNS resolution daemon
        - me.proton.vpn.split_tunneling.service    # Enables ProtonVPN split tunneling backend
        - btrbk.timer                              # Enables btrfs backup timer routine
        - scx_loader.service
        - firewalld.service
      disabled:
        - rpm-ostree-countme.timer                 # Disables sending analytics/counting data to Fedora
      masked:
        - bootc-fetch-apply-updates.timer          # Stops automatic bootc fetches (manual control only)
        - bootc-fetch-apply-updates.service        # Stops automatic bootc updates
        - systemd-remount-fs.service               # Masks remount service (often unnecessary on OSTree)
        - flatpak-add-fedora-repos.service   	   # No Fedora Flatpak repo, Flathub lives in files/system/etc/flatpak/remotes.d/flathub.flatpakrepo
    # user:
    #  enabled:
        # - some_service.service

########################
##  Kernel arguments  ##
########################

  # Set kernel arguments for disabling plymouth (since it is not part of Unwritten):
  - type: kargs
    kargs:
      - plymouth.enable=0
      - rd.plymouth=0
      - rd.info=1

  # Set kernel arguments for Varmilo keyboard, so you don’t have to press the `FN` key to get `F1`–`F12` working:
  - type: kargs
    kargs:
      - hid_apple.fnmode=2

#################
##  Initramfs  ##
#################

  - type: initramfs


######################
##  Make it clean.  ##
######################
  - type: script
    snippets:
      - rm -rf /usr/share/doc
      - rm -rf /usr/src
      - dnf5 versionlock clear
      - dnf5 clean all


#####################
##  Image signing  ##
#####################

 # Set up policy & signing files for your signed image:
  - type: signing 
  
