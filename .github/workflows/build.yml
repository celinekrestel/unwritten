name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
env:
  # The BlueBuild CLI does the build and handles the signing key, so its version is fixed here.
  # Left out, the action would take whatever the moving tag v0.9 points to on that day.
  # Dependabot can't see this line. To update: raise it on a branch, merge once Test Build is green.
  BLUEBUILD_CLI_VERSION: v0.9.37
jobs:
  # Builds from main are pushed and signed. The signing key lives in the 'signing' environment,
  # which only lets in runs from main (Settings → Environments). A workflow file that was changed
  # on another branch can't get past that.
  bluebuild:
    name: Build Custom Image
    if: github.ref == 'refs/heads/main'
    environment: signing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      # Pinned to a commit hash: unlike a version tag, a hash cannot be moved to other code.
      # This action receives the signing key. Dependabot proposes new versions as pull requests.
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          cli_version: ${{ env.BLUEBUILD_CLI_VERSION }}
          verify_install: true # stops the job unless the CLI was really built from blue-build/cli at that version

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  # Other branches and pull requests only check that the image still builds:
  # no key, and nothing is pushed.
  test-build:
    name: Test Build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Test Build
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ""
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          cli_version: ${{ env.BLUEBUILD_CLI_VERSION }}
          verify_install: true
          push: false
          maximize_build_space: true
